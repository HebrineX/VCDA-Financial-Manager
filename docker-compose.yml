version: '3.4'

services:
  web:
    image: vcda-financial-manager:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - App__EnforceHttps=false
      - DATAPROTECTION_CERT_PATH=/app/certs/dataprotection.pfx
      - DATAPROTECTION_CERT_PASSWORD=${DATAPROTECTION_CERT_PASSWORD}
    volumes:
      - ./docker-data/dataprotection:/home/app/.aspnet/DataProtection-Keys
      - ./docker-data/certs:/app/certs:ro
      - ./docker-data/app:/app/Data
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
