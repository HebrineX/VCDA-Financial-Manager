services:
  web:
    image: vcda-financial-manager:2.0.0
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - App__EnforceHttps=false
      - App__PublicBaseUrl=${APP_PUBLIC_BASE_URL:-https://localhost:8443}
      - App__ResetDatabaseOnStartup=${APP_RESET_DATABASE_ON_START:-false}
      - App__TrustedProxyNetworks__0=${APP_TRUSTED_PROXY_NETWORKS:-172.16.0.0/12}
      - AdminSeed__Enabled=${ADMIN_SEED_ENABLED:-false}
      - AdminSeed__Email=${ADMIN_SEED_EMAIL:-}
      - AdminSeed__UserName=${ADMIN_SEED_USERNAME:-}
      - AdminSeed__Password=${ADMIN_SEED_PASSWORD:-}
      - DATAPROTECTION_CERT_PATH=/app/certs/dataprotection.pfx
      - DATAPROTECTION_CERT_PASSWORD=${DATAPROTECTION_CERT_PASSWORD}
      - Smtp__Host=${Smtp__Host}
      - Smtp__Port=${Smtp__Port}
      - Smtp__EnableSsl=${Smtp__EnableSsl}
      - Smtp__FromEmail=${Smtp__FromEmail}
      - Smtp__FromName=${Smtp__FromName}
      - Smtp__Username=${Smtp__Username}
      - Smtp__Password=${Smtp__Password}
    volumes:
      - ./docker-data/dataprotection:/home/app/.aspnet/DataProtection-Keys
      - ./docker-data/certs:/app/certs:ro
      - ./docker-data/app:/app/Data
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
      - "${APP_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker-data/certs:/etc/nginx/certs:ro
