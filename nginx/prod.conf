map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=vcda_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=vcda_auth:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=vcda_conn:10m;
limit_req_status 429;

server_tokens off;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name finanzas.vircomdelan.com.ar;
    client_max_body_size 10m;
    limit_conn vcda_conn 20;

    ssl_certificate /etc/letsencrypt/live/finanzas.vircomdelan.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finanzas.vircomdelan.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    location = /health {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;
        deny all;

        proxy_pass http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location ~* ^/(?:\.env|\.git|\.svn|\.hg|\.DS_Store|\.vscode|\.idea|wp-|wordpress|wp/|xmlrpc\.php|phpmyadmin|pma|adminer|server-status|actuator|console|telescope|debug|info\.php|config\.json|swagger|api-docs|v[23]/api-docs|trace\.axd|@vite/env) {
        access_log off;
        return 444;
    }

    location ~* \.(?:bak|backup|old|orig|save|swp|sql|sqlite|db|log|ini|conf|env)$ {
        access_log off;
        return 444;
    }

    location ^~ /Account/ {
        limit_req zone=vcda_auth burst=20 nodelay;

        proxy_pass http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        limit_req zone=vcda_general burst=40 nodelay;

        proxy_pass http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
