services:
  web:
    image: vcda-financial-manager:2.2.1
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - App__EnforceHttps=false
      - App__PublicBaseUrl=https://finanzas.vircomdelan.com.ar
      - App__ResetDatabaseOnStartup=false
      - App__TrustedProxyNetworks__0=${APP_TRUSTED_PROXY_NETWORKS:-172.16.0.0/12}
      - AdminSeed__Enabled=${ADMIN_SEED_ENABLED:-false}
      - AdminSeed__Email=${ADMIN_SEED_EMAIL:-}
      - AdminSeed__UserName=${ADMIN_SEED_USERNAME:-}
      - AdminSeed__Password=${ADMIN_SEED_PASSWORD:-}
      - DATAPROTECTION_CERT_PATH=/app/certs/dataprotection.pfx
      - DATAPROTECTION_CERT_PASSWORD=${DATAPROTECTION_CERT_PASSWORD}
      - Smtp__Host=${Smtp__Host}
      - Smtp__Port=${Smtp__Port}
      - Smtp__EnableSsl=${Smtp__EnableSsl}
      - Smtp__FromEmail=${Smtp__FromEmail}
      - Smtp__FromName=${Smtp__FromName}
      - Smtp__Username=${Smtp__Username}
      - Smtp__Password=${Smtp__Password}
    volumes:
      - ./docker-data/dataprotection:/home/app/.aspnet/DataProtection-Keys
      - ./docker-data/certs:/app/certs:ro
      - ./docker-data/app:/app/Data

  nginx:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      - web
    ports:
      # F8-B: produccion expone solo HTTPS publico.
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker-data/letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/dns-cloudflare:v5.6.0
    profiles:
      - certbot
    volumes:
      - ./docker-data/letsencrypt:/etc/letsencrypt
      - ./certbot/cloudflare.ini:/run/secrets/cloudflare.ini:ro
    command:
      - certonly
      - --dns-cloudflare
      - --dns-cloudflare-credentials
      - /run/secrets/cloudflare.ini
      - --dns-cloudflare-propagation-seconds
      - "60"
      - --non-interactive
      - --agree-tos
      - --email
      - ${LETSENCRYPT_EMAIL}
      - -d
      - finanzas.vircomdelan.com.ar
